name: Check .txt files for all members

on:
  push:
  pull_request:

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify .txt files exist and are not empty
        run: |
          echo "Checking text files..."
          for file in *.txt; do
            if [ ! -s "$file" ]; then
              echo "❌ ERROR: File $file is missing or empty."
              exit 1
            else
              echo "✅ OK: $file exists and has content."
            fi
          done
